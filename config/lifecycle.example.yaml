# Example lifecycle defaults. Scripts use environment variables directly; this
# file documents recommended values for shell/profile setup.

paths:
  work_root: "${CTF_WORK_ROOT:-~/CTF/work}"
  local_run_root: "${CTF_LOCAL_RUN_ROOT:-~/.ctf-solver/runs}"
  lock_root: "${CTF_LOCK_ROOT:-~/.ctf-solver/locks}"
  lease_root: "${CTF_LEASE_ROOT:-~/.ctf-solver/leases}"
  queue_root: "${CTF_QUEUE_ROOT:-~/.ctf-solver/queue}"
  solved_writeup_root: "${CTF_SOLVED_WRITEUP_ROOT:-~/SolvedWriteUp}"
  metrics_root: "<repo>/metrics"

platform:
  config: "${CTF_PLATFORM_CONFIG:-<repo>/config/platforms.example.yaml}"

metrics:
  mode: "${CTF_METRICS_MODE:-public}"
  include_challenge_name: false

git:
  auto_push: "${CTF_AUTO_PUSH:-0}"
  repo_root: "${CTF_SOLVER_REPO_ROOT:-<script parent repo>}"
